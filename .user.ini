; LearnHub — PHP limits for CGI/FastCGI setups (mod_php ignores this file and
; uses the .htaccess php_value block instead; InfinityFree ignores both).
; Values use explicit M (megabytes) — safest across parsers. NOTE: the Apache
; body-size cap (LimitRequestBody) lives in .htaccess, not here.
upload_max_filesize = 4096M
post_max_size = 4096M
max_execution_time = 600
max_input_time = 3600
memory_limit = 512M